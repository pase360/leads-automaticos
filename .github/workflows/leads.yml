name: Generar leads

on:
  schedule:
    - cron: '17 11 * * *'
    - cron: '47 12 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Modo prueba (true = no carga nada en Odoo)'
        default: 'true'

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar y cargar leads
        run: python leads.py
        env:
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
          ODOO_ETAPA: ${{ secrets.ODOO_ETAPA }}
          ODOO_EMPRESA: ${{ secrets.ODOO_EMPRESA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENTO: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.prueba == 'true' && '1' || '0' }}
      - name: Guardar historial
        if: always()
        run: |
          git config user.name 'leads-bot'
          git config user.email 'leads-bot@users.noreply.github.com'
          git add historial.txt serper_uso.txt ultima_corrida.txt || true
          git diff --cached --quiet || (git commit -m 'Actualizar historial' && git push)
